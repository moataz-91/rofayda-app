<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0369A1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%;box-sizing:border-box}</style>
</head><body>
<title>Rofayda Patient App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root { --brand: #0369A1; --brand-deep: #0C4A6E; --ink: #0F172A; --muted: #64748B; --line: #E2E8F0; --paper: #F8FAFC; --stage: #DCE7F0; --ok: #059669; color-scheme: light; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--stage); color: var(--ink); font-family: 'Cairo', 'Inter', system-ui, sans-serif; overflow: hidden; }


*{box-sizing:border-box}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #10B981;outline-offset:2px}
a{color:#0369A1}a:hover{color:#075985}
.scroll{overflow-y:auto;scrollbar-width:thin}
.hscroll{overflow-x:auto;scrollbar-width:none}
.btn{border:0;border-radius:14px;min-height:48px;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-primary{background:#0369A1;color:#FFFFFF}
.btn-primary:hover{background:#075985;color:#FFFFFF}
.btn-green{background:#059669;color:#FFFFFF}
.btn-green:hover{background:#047857}
.btn-red{background:#DC2626;color:#FFFFFF}
.btn-red:hover{background:#B91C1C}
.btn-amber{background:#D97706;color:#FFFFFF}
.btn-outline{background:#FFFFFF;color:#0F172A;border:1px solid #E2E8F0}
.btn-outline:hover{background:#F8FAFC}
.btn-sm{min-height:40px;border-radius:12px;padding:0 14px;font-size:14px}
.card{background:#FFFFFF;border:1px solid #E2E8F0;border-radius:18px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:#0F172A;position:relative}
.iconbtn:hover{background:#DBEAFE}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:19px;font-size:13px;font-weight:700;border:1px solid #E2E8F0;background:#FFFFFF;color:#0F172A}
.lbl{font-size:13px;color:#64748B}
.num{font-family:Inter,sans-serif;direction:ltr;unicode-bidi:isolate}
.fld{height:40px;border:1px solid #CBD5E1;border-radius:10px;padding:0 10px;background:#FFFFFF;min-width:0;width:100%}
.sig{direction:ltr;text-align:center;padding:12px;font-size:12.5px;color:#94A3B8;font-family:'Segoe UI',Inter,sans-serif}
.sig b{color:#0EA5E9;font-weight:900}
.ring{animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.8);opacity:0}}
.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:#D1FAE5;box-shadow:0 0 0 3px #10B981}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.toast{animation:toast .35s ease-out}
@keyframes toast{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.sheet{animation:sheet .3s ease-out}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.pulse{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.blink{animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:.35}}
.ticker{display:inline-block;white-space:nowrap;padding-right:100%;animation:ticker 30s linear infinite}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(100%)}}
@media (prefers-reduced-motion: reduce){.ring,.flash,.toast,.pop,.sheet,.pulse,.blink,.ticker{animation:none}}

#stage { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; }
#device { position: relative; width: 100%; height: 100%; background: var(--paper); overflow: hidden; }
#root, #root > #screen { height: 100%; }
@media (min-width: 560px) and (min-height: 700px) {
  #stage { background: radial-gradient(1200px 600px at 50% -10%, #E0F2FE, var(--stage)); }
  #device { width: 392px; height: min(844px, calc(100% - 40px)); border-radius: 44px; border: 10px solid #0F172A; box-shadow: 0 40px 80px -40px rgba(12,74,110,.55); }
}
/* tester layer */
#t-fab { position: absolute; z-index: 30; left: 0; top: 46%; width: 30px; min-height: 92px; padding: 10px 0; border-radius: 0 12px 12px 0; border: 0; background: rgba(15,23,42,.78); color: #FFFFFF; font: 700 12px/1 'Cairo', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 16px -6px rgba(0,0,0,.45); }
#t-fab span:last-child { writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: .02em; }
#t-fab .t-dot { width: 8px; height: 8px; border-radius: 4px; background: #FBBF24; }
#t-fab.has .t-dot { background: #34D399; }
#t-scrim { position: absolute; inset: 0; z-index: 40; background: rgba(15,23,42,.45); display: flex; align-items: flex-end; }
#t-sheet { width: 100%; max-height: 88%; overflow-y: auto; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; font-family: 'Cairo', sans-serif; animation: sheet .28s ease-out; }
.t-grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 2px; }
.t-tabs { display: flex; background: #F1F5F9; border-radius: 12px; padding: 3px; }
.t-tab { flex: 1; min-height: 38px; border: 0; border-radius: 10px; background: transparent; font-weight: 700; font-size: 13.5px; color: #334155; }
.t-tab.on { background: #FFFFFF; color: var(--brand); box-shadow: 0 1px 3px rgba(15,23,42,.12); }
.t-where { font-size: 14px; }
.t-muted { color: var(--muted); } .t-small { font-size: 12.5px; line-height: 1.6; }
.t-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.t-chip { min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: #FFFFFF; font-weight: 700; font-size: 13px; }
.t-chip.on { background: var(--brand); border-color: var(--brand); color: #FFFFFF; }
.t-label { font-size: 13px; font-weight: 700; color: #334155; margin-top: 2px; }
#t-text, #t-name { width: 100%; border: 1px solid #CBD5E1; border-radius: 14px; padding: 10px 12px; font: inherit; font-size: 15px; background: #FFFFFF; resize: vertical; }
#t-name { height: 46px; }
.t-primary { min-height: 48px; border: 0; border-radius: 14px; background: var(--brand); color: #FFFFFF; font-weight: 800; font-size: 15px; }
.t-secondary { min-height: 44px; border: 1px solid var(--line); border-radius: 14px; background: #FFFFFF; font-weight: 700; font-size: 14px; flex: 1; }
.t-close { min-height: 40px; border: 0; background: none; color: var(--muted); font-weight: 700; }
.t-row { display: flex; gap: 8px; }
.t-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.t-action { min-height: 52px; border: 1px solid #BAE6FD; border-radius: 14px; background: #F0F9FF; color: #075985; font-weight: 700; font-size: 13px; line-height: 1.4; padding: 6px 8px; }
.t-switches { display: flex; flex-direction: column; gap: 6px; }
.t-switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 46px; border: 1px solid var(--line); border-radius: 12px; background: #FFFFFF; padding: 0 12px; font-weight: 700; font-size: 13.5px; text-align: start; }
.t-knob { flex: none; width: 42px; height: 24px; border-radius: 12px; background: #CBD5E1; position: relative; }
.t-knob::after { content: ''; position: absolute; top: 3px; inset-inline-end: 3px; width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; transition: inset .15s; }
.t-switch.on .t-knob { background: var(--brand); }
.t-switch.on .t-knob::after { inset-inline-end: 21px; }
.t-list { display: flex; flex-direction: column; gap: 8px; }
.t-note { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.t-note-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.t-note-text { font-size: 14px; line-height: 1.6; white-space: pre-line; text-align: start; }
.t-tag { font-size: 11.5px; font-weight: 800; border-radius: 9px; padding: 1px 9px; }
.k-add { background: #DBEAFE; color: #075985; } .k-remove { background: #FEE2E2; color: #B91C1C; } .k-look { background: #EDE9FE; color: #6D28D9; } .k-bug { background: #FEF3C7; color: #92400E; }
.t-empty { text-align: center; color: var(--muted); padding: 24px 8px; }
#t-toast { position: absolute; z-index: 50; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); background: #065F46; color: #FFFFFF; font: 700 13.5px/1.5 'Cairo', sans-serif; padding: 8px 14px; border-radius: 14px; max-width: 90%; text-align: center; box-shadow: 0 10px 24px -10px rgba(0,0,0,.4); }
@media (prefers-reduced-motion: reduce) { #t-sheet { animation: none; } }
</style>
<div id="stage"><div id="device"><div id="root"></div></div></div>
<template id="tpl"><div dir="{{ pDir }}" id="screen" style="position: relative; width: 100%; height: 100%; overflow: hidden; background: #F8FAFC; display: flex; flex-direction: column; font-family: {{ pFont }}">

          <sc-if value="{{ hasPToast }}" hint-placeholder-val="{{ false }}">
            <div class="toast" role="status" style="position: absolute; top: 14px; left: 12px; right: 12px; z-index: 9; background: #0F172A; color: #FFFFFF; border-radius: 16px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; font-size: 13.5px; line-height: 1.5; box-shadow: 0 10px 30px rgba(0,0,0,.3)">
              <img src="__LOGO__" alt="" style="flex: none; width: 26px; height: 33px; border-radius: 6px; display: block; background: #FFFFFF">
              <span><span style="display: block; font-size: 11px; color: #94A3B8; font-weight: 700">{{ pToastFrom }}</span>{{ pToastText }}</span>
            </div>
          </sc-if>

          <div class="scroll" style="flex: 1; min-height: 0; display: flex; flex-direction: column">

            <!-- Splash -->
            <sc-if value="{{ pSplash }}" hint-placeholder-val="{{ true }}">
              <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 22px 28px 10px; text-align: center; background: #0284C7; color: #FFFFFF; position: relative">
                <button onClick="{{ toggleLang }}" style="position: absolute; top: 24px; inset-inline-end: 22px; min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.15); color: #FFFFFF; font-weight: 700; font-size: 13px">{{ t.langBtn }}</button>
                <img class="pop" src="__LOGO__" alt="Rofayda Hospital" style="width: 130px; height: 166px; display: block; border-radius: 18px; margin-top: 30px">
                <div style="font-size: 30px; font-weight: 800; margin-top: 18px">{{ t.hospital }}</div>
                <div style="font-size: 16px; opacity: .92">{{ t.splashTag }}</div>
                <button class="btn" onClick="{{ goOnboarding }}" style="margin-top: 44px; width: 100%; background: #FFFFFF; color: #0369A1">{{ t.start }}</button>
                <div class="sig" style="color: #E0F2FE; margin-top: auto">Designed &amp; Developed by <b style="color: #FFFFFF">Eng. Moataz Shoman</b></div>
              </div>
            </sc-if>

            <!-- Onboarding -->
            <sc-if value="{{ pOnboarding }}" hint-placeholder-val="{{ false }}">
              <div style="flex: 1; display: flex; flex-direction: column; padding: 20px 22px 24px">
                <div style="display: flex; justify-content: space-between; min-height: 44px">
                  <button class="btn btn-sm" onClick="{{ toggleLang }}" style="background: #EFF6FF; color: #0369A1">{{ t.langBtn }}</button>
                  <button class="btn btn-sm" onClick="{{ goLogin }}" style="background: transparent; color: #0369A1">{{ t.skip }}</button>
                </div>
                <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px">
                  <div style="width: 88px; height: 88px; border-radius: 26px; background: #DBEAFE; color: #0369A1; display: flex; align-items: center; justify-content: center">
                    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ obIcon }}"></path></svg>
                  </div>
                  <h2 style="margin: 0; font-size: 30px; line-height: 1.3; font-weight: 800">{{ obTitle }}</h2>
                  <p style="margin: 0; font-size: 17px; color: #64748B">{{ obBody }}</p>
                </div>
                <div style="display: flex; align-items: center; justify-content: space-between">
                  <div style="display: flex; gap: 6px">
                    <sc-for list="{{ obDots }}" as="dot" hint-placeholder-count="3">
                      <span style="height: 8px; border-radius: 4px; width: {{ dot.w }}px; background: {{ dot.bg }}; transition: width .25s"></span>
                    </sc-for>
                  </div>
                  <button class="btn btn-primary" style="width: 150px" onClick="{{ obNext }}">{{ obNextLabel }}</button>
                </div>
              </div>
            </sc-if>

            <!-- Login (the code appears on the same screen) -->
            <sc-if value="{{ pLogin }}" hint-placeholder-val="{{ false }}">
              <div style="flex: 1; display: flex; flex-direction: column; padding: 34px 22px 24px; gap: 14px">
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px">
                  <img src="__LOGO__" alt="" style="width: 38px; height: 49px; border-radius: 7px; display: block">
                  <span style="font-size: 20px; font-weight: 800">{{ t.hospital }}</span>
                </div>
                <h2 style="margin: 0; font-size: 26px; font-weight: 800">{{ t.loginTitle }}</h2>
                <p style="margin: -8px 0 6px; color: #64748B">{{ t.loginSub }}</p>
                <div>
                  <label for="phone-in" class="lbl" style="display: block; margin-bottom: 6px">{{ t.phoneLabel }}</label>
                  <div style="display: flex; gap: 8px; direction: ltr">
                    <span style="flex: none; height: 54px; border: 1px solid #E2E8F0; border-radius: 14px; padding: 0 14px; background: #FFFFFF; display: flex; align-items: center; font-weight: 700">+20</span>
                    <input id="phone-in" dir="ltr" value="010 1234 5678" onChange="{{ noop }}" style="flex: 1; min-width: 0; height: 54px; border: 1px solid #E2E8F0; border-radius: 14px; padding: 0 16px; background: #FFFFFF; font-size: 17px; letter-spacing: .5px">
                  </div>
                </div>
                <sc-if value="{{ otpNotSent }}" hint-placeholder-val="{{ true }}">
                  <div style="display: flex; flex-direction: column; gap: 14px">
                    <button class="btn btn-primary" style="width: 100%; margin-top: 4px" onClick="{{ sendOtp }}">{{ t.sendCode }}</button>
                    <div style="display: flex; align-items: center; gap: 12px; color: #64748B; font-size: 13px"><span style="flex: 1; height: 1px; background: #E2E8F0"></span>{{ t.or }}<span style="flex: 1; height: 1px; background: #E2E8F0"></span></div>
                    <button class="btn btn-outline" style="width: 100%" onClick="{{ verifyOtp }}">{{ t.google }}</button>
                  </div>
                </sc-if>
                <sc-if value="{{ otpSent }}" hint-placeholder-val="{{ false }}">
                  <div style="display: flex; flex-direction: column; gap: 12px">
                    <div class="toast" style="display: flex; flex-direction: column; gap: 12px; border-radius: 18px; background: #F0F9FF; border: 1px solid #BAE6FD; padding: 14px">
                      <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
                        <b style="font-size: 16px">{{ t.otpTitle }}</b>
                        <button onClick="{{ changeNumber }}" style="border: 0; background: none; color: #0369A1; font: inherit; font-size: 13px; font-weight: 700; padding: 4px 0">{{ t.changeNumber }}</button>
                      </div>
                      <div style="font-size: 13px; color: #475569">{{ t.otpSent }} <span class="num" dir="ltr">+20 010 1234 5678</span>. {{ t.otpAuto }}</div>
                      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; direction: ltr">
                        <sc-for list="{{ otpDigits }}" as="od" hint-placeholder-count="6">
                          <span class="pop" style="height: 54px; border-radius: 14px; border: 2px solid #0369A1; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 23px; font-weight: 800">{{ od.d }}</span>
                        </sc-for>
                      </div>
                      <div style="font-size: 12.5px; color: #64748B; text-align: center">{{ t.otpResend }}</div>
                    </div>
                    <button class="btn btn-primary" style="width: 100%" onClick="{{ verifyOtp }}">{{ t.verify }}</button>
                  </div>
                </sc-if>
              </div>
            </sc-if>

            <!-- Registration (once) -->
            <sc-if value="{{ pRegister }}" hint-placeholder-val="{{ false }}">
              <div style="flex: 1; display: flex; flex-direction: column; padding: 26px 22px 22px; gap: 14px">
                <div style="display: flex; gap: 6px"><span style="flex: 1; height: 5px; border-radius: 3px; background: #0369A1"></span><span style="flex: 1; height: 5px; border-radius: 3px; background: #0369A1"></span><span style="flex: 1; height: 5px; border-radius: 3px; background: #BAE6FD"></span></div>
                <h2 style="margin: 4px 0 0; font-size: 26px; font-weight: 800">{{ t.regTitle }}</h2>
                <p style="margin: -8px 0 2px; color: #64748B">{{ t.regSub }}</p>
                <div>
                  <label for="reg-name" class="lbl" style="display: block; margin-bottom: 6px">{{ t.fullName }}</label>
                  <input id="reg-name" dir="auto" value="{{ reg.name }}" onChange="{{ onRegName }}" autocomplete="name" style="width: 100%; height: 52px; border: 1px solid #E2E8F0; border-radius: 14px; padding: 0 16px; background: #FFFFFF; font: inherit; font-size: 16px; box-sizing: border-box">
                </div>
                <div>
                  <label for="reg-dob" class="lbl" style="display: block; margin-bottom: 6px">{{ t.dob }}</label>
                  <div style="display: flex; gap: 8px; align-items: center">
                    <input id="reg-dob" type="date" value="{{ reg.dob }}" onChange="{{ onRegDob }}" autocomplete="bday" style="flex: 1; min-width: 0; height: 52px; border: 1px solid #E2E8F0; border-radius: 14px; padding: 0 14px; background: #FFFFFF; font: inherit; font-size: 16px">
                    <span style="flex: none; min-height: 52px; border-radius: 14px; background: #EFF6FF; color: #0369A1; font-weight: 800; padding: 0 14px; display: flex; align-items: center">{{ reg.age }}</span>
                  </div>
                </div>
                <div>
                  <div class="lbl" style="margin-bottom: 6px">{{ t.gender }}</div>
                  <div role="radiogroup" aria-label="{{ t.gender }}" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
                    <sc-for list="{{ reg.genders }}" as="gn" hint-placeholder-count="2">
                      <button role="radio" aria-checked="{{ gn.aria }}" onClick="{{ gn.go }}" style="min-height: 50px; border-radius: 14px; border: {{ gn.border }}; background: {{ gn.bg }}; color: {{ gn.fg }}; font: inherit; font-weight: 700; font-size: 15px">{{ gn.label }}</button>
                    </sc-for>
                  </div>
                </div>
                <div>
                  <label for="reg-nid" class="lbl" style="display: block; margin-bottom: 6px">{{ t.nid }}</label>
                  <input id="reg-nid" dir="ltr" inputmode="numeric" maxlength="14" value="{{ reg.nid }}" onChange="{{ onRegNid }}" placeholder="2 9 2 0 5 1 2 . . . . . . ." style="width: 100%; height: 52px; border: 1px solid #E2E8F0; border-radius: 14px; padding: 0 16px; background: #FFFFFF; font: inherit; font-size: 16px; box-sizing: border-box; letter-spacing: 1px">
                  <div style="font-size: 12px; color: #64748B; margin-top: 4px">{{ t.nidHint }}</div>
                </div>
                <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
                  <div style="font-size: 12.5px; color: #0369A1; font-weight: 700; text-align: center">{{ t.medNoNote }}</div>
                  <button class="btn btn-primary" style="width: 100%" disabled="{{ reg.cant }}" onClick="{{ finishReg }}">{{ t.createAccount }}</button>
                </div>
              </div>
            </sc-if>

            <!-- Home -->
            <sc-if value="{{ pHome }}" hint-placeholder-val="{{ false }}">
              <div style="padding: 16px 16px 10px; display: flex; flex-direction: column; gap: 14px">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                  <div style="display: flex; align-items: center; gap: 10px">
                    <img src="__LOGO__" alt="Rofayda Hospital" style="width: 34px; height: 44px; border-radius: 7px; display: block">
                    <div>
                      <div style="font-size: 20px; font-weight: 800; line-height: 1.3">{{ t.hello }}</div>
                      <div class="lbl">{{ t.homeSub }}</div>
                    </div>
                  </div>
                  <button class="iconbtn" aria-label="{{ t.notifs }}" onClick="{{ goNotifs }}">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
                    <sc-if value="{{ hasPUnread }}" hint-placeholder-val="{{ false }}">
                      <span class="pop" style="position: absolute; top: 6px; inset-inline-end: 6px; min-width: 18px; height: 18px; border-radius: 9px; background: #E11D48; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px">{{ pUnread }}</span>
                    </sc-if>
                  </button>
                </div>

                <sc-if value="{{ hasMyLive }}" hint-placeholder-val="{{ false }}">

  roomOpen(s, r) { return r.open && this.areaOf(s, r.b).on; }
  // "مبنى العيادات · عيادة 3" / "Clinics Bldg · Clinic 3"
  place(s, r, l) { const a = this.areaOf(s, r.b); return l === 'en' ? a.shortEn + ' · Clinic ' + r.no : a.short + ' · عيادة ' + r.no; }
  rn(r, l) { return l === 'en' ? r.nameEn : r.name; }
  dn(r, l) { return l === 'en' ? r.docEn : r.doc; }
  bi(fn) { return { en: fn('en'), ar: fn('ar') }; }
  tx(p, l) { return p == null ? '' : (typeof p === 'string' ? p : p[l]); }

  ev(s, kind, title, detail) {
    this.seq += 1;
    s.events.unshift({ id: 'e' + this.seq, kind: kind, title: title, detail: detail });
    s.events = s.events.slice(0, 8);
  }
  toast(s, which, text, from) {
    this.seq += 1; const id = this.seq;
    s[which] = { id: id, text: text, from: from || { en: 'Rofayda Hospital', ar: 'مستشفى رفيدة' } };
    setTimeout(() => this.mut((x) => { if (x[which] && x[which].id === id) x[which] = null; }), 4200);
  }
  notify(s, text, go, key) {
    this.seq += 1;
    if (key) s.pNotifs = s.pNotifs.filter((n) => n.key !== key);
    s.pNotifs.unshift({ id: 'n' + this.seq, key: key || null, text: text, ts: Date.now(), unread: true, go: go || 'ticket' });
    s.pNotifs = s.pNotifs.slice(0, 30);
  }

  // رقم جديد: عداد لكل عيادة في كل يوم (عادي وطوارئ لوحدهم)، جوه transaction واحدة في قاعدة البيانات
  issueRaw(s, roomId, kind, name, phone, source, arrived, mine, day) {
    const r = this.roomOf(s, roomId);
    if (!r.cnt[day]) r.cnt[day] = { N: 0, E: 0 };
    r.cnt[day][kind] += 1;
    const n = r.cnt[day][kind];
    this.seq += 1;
    const t = {
      id: 't' + this.seq, room: roomId, kind: kind, n: n, day: day,
      code: kind === 'E' ? 'E-' + r.letter + '-' + n : r.letter + '-' + n,
      orig: null, name: name, phone: phone, source: source, arrived: arrived, mine: mine,
      status: 'waiting', created: Date.now(), calledAt: null, rx: '', rated: false, fresh: true, passed: false, near: false, boost: false
    };
    s.tickets.push(t);
    return t;
  }

  waitingOf(s, roomId, day) {
    return s.tickets.filter((t) => t.room === roomId && t.day === (day || 0) && t.status === 'waiting')
      .sort((a, b) => {
        if (a.kind !== b.kind) return a.kind === 'E' ? -1 : 1;
        const pa = a.boost ? 0 : 1, pb = b.boost ? 0 : 1;
        return pa !== pb ? pa - pb : a.n - b.n;
      });
  }
  eligible(s, t) { return !(s.settings.arrival && (t.source === 'online' || t.source === 'app') && !t.arrived); }
  aheadOf(s, t) {
    const list = this.waitingOf(s, t.room, t.day);
    const idx = list.findIndex((x) => x.id === t.id);
    const r = this.roomOf(s, t.room);
    return Math.max(0, idx) + (t.day === 0 && r.current ? 1 : 0);
  }

  announce(s, roomId, code, type) {
    this.seq += 1;
    const r = this.roomOf(s, roomId);
    s.announce = { id: this.seq, room: roomId, code: code, type: type, ts: Date.now() };
    if (s.sound && !s.locks.display) {
      const id = this.seq; const lang = s.settings.voice;
      setTimeout(() => this.voice(id, code, r.no, type, lang), 30);
    }
  }

  unlockAudio() {
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!this.ac) this.ac = new C();
      if (this.ac.resume) this.ac.resume();
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
    } catch (e) { /* no audio */ }
  }

  voice(id, code, roomNo, type, lang) {
    if (this.spoken === id) return;
    this.spoken = id;
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!this.ac) this.ac = new C();
      const ac = this.ac;
      [880, 660].forEach((f, i) => {
        const o = ac.createOscillator(); const g = ac.createGain();
        o.frequency.value = f; o.connect(g); g.connect(ac.destination);
        const t0 = ac.currentTime + i * 0.35;
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
        o.start(t0); o.stop(t0 + 0.65);
      });
    } catch (e) { /* no audio */ }
    setTimeout(() => {
      try {
        const spoken = String(code).split('-').join(', ');
        const em = String(code).indexOf('E-') === 0;
        const en = type === 'emergency' ? 'Emergency! Room ' + roomNo + '.' : (em ? 'Emergency! ' : '') + 'Patient number, ' + spoken + '. Clinic number, ' + roomNo + '.';
        const ar = type === 'emergency' ? 'طوارئ، عيادة رقم ' + roomNo : (em ? 'طوارئ. ' : '') + 'المريض رقم ' + spoken + '، عيادة رقم ' + roomNo;
        window.speechSynthesis.cancel();
        const say = (text, l) => { const u = new SpeechSynthesisUtterance(text); u.lang = l; u.rate = l === 'en-US' ? 0.7 : 0.9; window.speechSynthesis.speak(u); };
        if (lang === 'en' || lang === 'both') say(en, 'en-US');
        if (lang === 'ar' || lang === 'both') say(ar, 'ar-EG');
      } catch (e) { /* no speech */ }
    }, 900);
  }

  // كل ما مريض يخرج: إشعار لكل اللي مستنيين في نفس العيادة (التطبيق وصفحة الـ QR)
  onExit(s, roomId, exited) {
    const r = this.roomOf(s, roomId);
    const now = r.current ? this.dispCode(s, this.tOf(s, r.current)) : '—';
    s.tickets.filter((t) => t.room === roomId && t.day === 0 && t.status === 'waiting').forEach((t) => {
      const a = this.aheadOf(s, t);
      const txt = this.bi((l) => l === 'en'
        ? 'A patient left ' + this.place(s, r, l) + ' · Now calling ' + now + ' · ' + (a === 0 ? 'You\'re next' : a + ' ahead of you')
        : 'خرج مريض من ' + this.place(s, r, l) + ' · النداء دلوقتي ' + now + ' · ' + (a === 0 ? 'إنت اللي عليه الدور' : 'قدامك ' + a));
      if (t.mine) {
        this.notify(s, txt, 'ticket', 'move-' + t.id);
        if (s.p === 'ticket' || s.p === 'home') this.toast(s, 'pToast', txt);
      }
      if (s.trackId === t.id && !t.mine) {
        s.track.log.unshift({ text: this.bi((l) => (l === 'en' ? exited + ' left · ' + a + ' ahead' : 'خرج ' + exited + ' · قدامك ' + a)), ts: Date.now() });
        s.track.log = s.track.log.slice(0, 8);
        if (s.track.notif) this.toast(s, 'pToast', txt, 'qms.rofayda.org');
      }
      if (a <= 2 && !t.near) {
        t.near = true;
        if (t.mine) this.notify(s, this.bi((l) => (l === 'en' ? 'Almost your turn: only ' + a + ' ahead at ' + this.place(s, r, l) : 'قرب دورك: قدامك ' + a + ' بس في ' + this.place(s, r, l))), 'ticket');
      }
    });
  }

  finishCurrent(s, roomId) {
    const r = this.roomOf(s, roomId);
    const cur = r.current ? this.tOf(s, r.current) : null;
    if (!cur) return null;
    cur.status = 'done'; cur.doneAt = Date.now(); r.current = null;
    if (cur.mine) this.notify(s, this.bi((l) => (l === 'en' ? 'Get well soon! Rate your visit with ' + r.docEn + (cur.rx && s.features.prescriptions ? '. Your prescription is ready.' : '.') : 'سلامتك! قيّم زيارتك مع ' + r.doc + (cur.rx && s.features.prescriptions ? '. والروشتة وصلت.' : ''))), 'ticket');
    if (s.trackId === cur.id && !cur.mine) { s.track.log.unshift({ text: { en: 'Visit finished. Get well soon!', ar: 'الكشف خلص. سلامتك!' }, ts: Date.now() }); }
    return cur;
  }

  setServing(s, r, t, type) {
    t.status = 'serving'; t.calledAt = Date.now(); r.current = t.id; t.arrived = true;
    this.announce(s, r.id, this.dispCode(s, t), type);
    const code = this.dispCode(s, t);
    const txt = this.bi((l) => (l === 'en'
      ? 'Number ' + code + ' is being called! Please go to ' + this.place(s, r, l) + ' · ' + r.floorEn
      : 'رقمك ' + code + ' اتنادى! اتفضل ' + this.place(s, r, l) + ' · ' + r.floor));
    if (t.mine) { this.notify(s, txt, 'ticket'); this.toast(s, 'pToast', txt); }
    if (s.trackId === t.id && !t.mine) {
      s.track.log.unshift({ text: this.bi((l) => (l === 'en' ? 'Your turn! Go to Clinic ' + r.no : 'دورك! اتفضل عيادة ' + r.no)), ts: Date.now() });
      if (s.track.notif) this.toast(s, 'pToast', txt, 'qms.rofayda.org');
    }
  }

  callNext(s, roomId, mode, by) {
    const r = this.roomOf(s, roomId);
    const exited = this.finishCurrent(s, roomId);
    let list = this.waitingOf(s, roomId, 0);
    if (mode === 'N') list = list.filter((t) => t.kind === 'N');
    if (mode === 'E') list = list.filter((t) => t.kind === 'E');
    const next = list.find((t) => this.eligible(s, t));
    list.forEach((t) => {
      if (next && t.id === next.id) return;
      if (!this.eligible(s, t) && next && (t.kind === next.kind ? t.n < next.n : t.kind === 'E') && !t.passed) {
        t.passed = true;
        if (t.mine) this.notify(s, this.bi((l) => (l === 'en' ? 'Your turn came while you were on the way. Number ' + t.code + ' is saved: check in when you arrive and you\'ll go in next.' : 'دورك جه وإنت لسه موصلتش. رقمك ' + t.code + ' محفوظ، وأول ما توصل وتسجل وصولك هتدخل على طول.')), 'ticket');
      }
    });
    if (next) {
      this.setServing(s, r, next, next.kind === 'E' ? 'vip' : 'call');
      this.ev(s, 'live', 'نداء ' + this.dispCode(s, next) + ' · ' + this.place(s, r, 'ar'), (by || 'الطبيب') + ' · شاشة ' + this.areaOf(s, r.b).short + ' وباب العيادة والمريض');
    } else {
      this.ev(s, 'db', 'call_next', this.place(s, r, 'ar') + ': مفيش حد واصل بره');
    }
    if (exited) this.onExit(s, roomId, this.dispCode(s, exited));
    return next;
  }

  skipCurrent(s, roomId) {
    const r = this.roomOf(s, roomId);
    const cur = r.current ? this.tOf(s, r.current) : null;
    if (!cur) return;
    cur.status = 'skipped'; r.current = null;
    if (cur.mine) this.notify(s, { en: 'Your number was called but you weren\'t there. Please talk to reception and they\'ll call you again.', ar: 'اتنادى رقمك ومكنتش موجود. كلّم الاستقبال وهيندهوك تاني.' }, 'ticket');
    this.ev(s, 'db', 'skip_ticket', cur.code + ' اتخطى · ' + this.place(s, r, 'ar'));
    const next = this.waitingOf(s, roomId, 0).filter((t) => t.kind === cur.kind).find((t) => this.eligible(s, t)) || this.waitingOf(s, roomId, 0).find((t) => this.eligible(s, t));
    if (next) this.setServing(s, r, next, next.kind === 'E' ? 'vip' : 'call');
    this.onExit(s, roomId, cur.code);
  }

  recall(s, roomId, code) {
    const r = this.roomOf(s, roomId);
    const c = String(code || '').trim().toUpperCase();
    const t = s.tickets.find((x) => x.room === roomId && x.day === 0 && (x.code === c || x.orig === c) && (x.status === 'skipped' || x.status === 'waiting'));
    if (!t) { this.toast(s, 'cToast', 'الرقم ده مش موجود في العيادة دي'); return false; }
    const exited = this.finishCurrent(s, roomId);
    this.setServing(s, r, t, 'recall');
    this.ev(s, 'live', 'نداء خاص ' + this.dispCode(s, t), this.place(s, r, 'ar') + ' · بالأصفر على الصالة');
    if (exited) this.onExit(s, roomId, this.dispCode(s, exited));
    return true;
  }

  transfer(s, roomId, targetId) {
    const r = this.roomOf(s, roomId); const tr = this.roomOf(s, targetId);
    const cur = r.current ? this.tOf(s, r.current) : null;
    if (!cur || roomId === targetId) return null;
    const nt = this.issueRaw(s, targetId, 'E', cur.name, cur.phone, 'transfer', true, cur.mine, 0);
    nt.orig = cur.orig || cur.code;
    cur.status = 'transferred'; cur.to = nt.id; r.current = null;
    if (s.trackId === cur.id) s.trackId = nt.id;
    this.ev(s, 'db', 'transfer_ticket', cur.code + ' → ' + this.place(s, tr, 'ar') + ' برقم أولوية ' + nt.code);
    if (cur.mine) {
      this.notify(s, this.bi((l) => (l === 'en'
        ? 'The doctor referred you to ' + tr.nameEn + ' (' + this.place(s, tr, l) + '). ' + (s.settings.unified ? 'You keep number ' + nt.orig + '.' : 'Your new number is ' + nt.code + '.') + ' You have priority.'
        : 'الدكتور حولك لـ ' + tr.name + ' (' + this.place(s, tr, l) + '). ' + (s.settings.unified ? 'رقمك هيفضل ' + nt.orig + '.' : 'رقمك الجديد ' + nt.code + '.') + ' وليك أولوية.')), 'ticket');
      this.toast(s, 'pToast', this.bi((l) => (l === 'en' ? 'Referred to ' + this.place(s, tr, l) + ' with priority' : 'اتحولت لـ ' + this.place(s, tr, l) + ' بأولوية')));
    }
    this.onExit(s, roomId, cur.code);
    return nt;
  }

  emergencyAlert(s, roomId, by) {
    const r = this.roomOf(s, roomId);
    s.emergency[roomId] = Date.now();
    this.announce(s, roomId, 'EMERGENCY', 'emergency');
    s.docEm = roomId;
    this.ev(s, 'live', 'تنبيه طوارئ فوري · ' + this.place(s, r, 'ar'), (by || 'الاستقبال') + ' · صالة ' + this.areaOf(s, r.b).short + ' بالأحمر والدكتور جاله تنبيه');
  }

  arrive(s, tid) {
    const t = this.tOf(s, tid);
    if (!t || t.arrived) return;
    t.arrived = true;
    if (t.passed && t.status === 'waiting') t.boost = true;
    const r = this.roomOf(s, t.room);
    this.ev(s, 'db', 'confirm_arrival', t.code + ' وصل · ' + this.place(s, r, 'ar') + (t.boost ? ' · هيدخل اللي جاي على طول' : ''));
    if (t.mine) { this.notify(s, this.bi((l) => (l === 'en' ? 'You\'re checked in. Number ' + t.code + ' is now in the queue.' : 'اتسجل وصولك. رقمك ' + t.code + ' في الطابور دلوقتي.')), 'ticket'); this.toast(s, 'pToast', { en: 'You\'re checked in', ar: 'اتسجل وصولك' }); }
  }

  bookMine(s, roomId, day, source) {
    let rid = roomId;
    const r0 = this.roomOf(s, roomId);
    let lbNote = null;
    if (s.settings.lb && day === 0) {
      const same = s.rooms.filter((r) => r.spec === r0.spec && r.b === r0.b && this.roomOpen(s, r));
      if (same.length > 1) {
        same.sort((a, b) => this.waitingOf(s, a.id, 0).length - this.waitingOf(s, b.id, 0).length);
        if (same[0].id !== roomId) {
          const best = same[0]; rid = best.id;
          lbNote = this.bi((l) => (l === 'en' ? 'Smart routing moved you to Clinic ' + best.no + ' (' + best.docEn + '), the shorter queue' : 'التوزيع الذكي حولك لعيادة ' + best.no + ' (' + best.doc + ') لأنها الأقل زحمة'));
        }
      }
    }
    const t = this.issueRaw(s, rid, 'N', 'أحمد محمد علي', '01012345678', source || 'app', false, true, day);
    const r = this.roomOf(s, rid);
    const d = this.days()[day];
    s.trackId = t.id; s.p = 'ticket';
    this.ev(s, 'db', 'take_ticket', t.code + ' · ' + r.name + ' · ' + this.place(s, r, 'ar') + (day === 0 ? ' · النهارده' : ' · ' + d.name[1]));
    this.ev(s, 'live', 'Realtime ← استقبال ' + this.areaOf(s, r.b).short, 'التذكرة نزلت في طابور العيادة من غير ريفرش');
    this.notify(s, this.bi((l) => (l === 'en'
      ? 'You got number ' + t.code + ' at ' + r.nameEn + ', ' + this.place(s, r, l) + (day === 0 ? ' today.' : ' on ' + d.name[0] + '.') + ' First come, first served.'
      : 'اتحجزلك رقم ' + t.code + ' في ' + r.name + '، ' + this.place(s, r, l) + (day === 0 ? ' النهارده.' : ' يوم ' + d.name[1] + '.') + ' الدخول بأسبقية الحضور.')), 'ticket');
    if (lbNote) this.toast(s, 'pToast', lbNote);
    return t;
  }

  myActive(s) {
    const mine = s.tickets.filter((t) => t.mine && (t.status === 'waiting' || t.status === 'serving'));
    return mine.length ? mine[mine.length - 1] : null;
  }

  printTicket(s, t) { s.print = t.id; }

  login(s, who) {
    s.who = who;
    const u = this.user(s);
    const tabs = this.tabsFor(u.role);
    if (tabs.indexOf(s.panel) < 0) s.panel = tabs[0];
    const rooms = this.scopeRooms(s);
    const areas = this.scopeAreas(s);
    if (areas.length) { s.recA = areas[0].id; s.kioskA = areas[0].id; s.dispA = areas[0].id; }
    if (rooms.length) {
      if (!rooms.some((r) => r.id === s.recRoom)) s.recRoom = rooms[0].id;
      if (!rooms.some((r) => r.id === s.docRoom)) s.docRoom = rooms[0].id;
      if (!rooms.some((r) => r.id === s.doorRoom)) s.doorRoom = rooms[0].id;
    }
    s.kioskRoom = null; s.issued = null;
    this.ev(s, 'db', 'تسجيل دخول: ' + u.label, u.areas ? 'بيشوف: ' + areas.map((a) => a.short).join(' + ') + ' بس' : u.room ? 'بيشوف عيادته بس' : 'بيشوف كل المباني');
  }

  // ================= realtime simulation =================
  tick() {
    this.ticks += 1;
    const s = this.state;
    const patch = { now: Date.now() };
    if (s.announce && Date.now() - s.announce.ts > 7000) patch.announce = null;
    this.setState(patch);
    if (s.sim && this.ticks % 6 === 0) this.simulate();
  }

  simulate() {
    this.mut((s) => {
      const pool = s.rooms.filter((r) => r.id !== s.docRoom && this.roomOpen(s, r));
      if (!pool.length) return;
      const r = pool[Math.floor(Math.random() * pool.length)];
      if (Math.random() < 0.55) {
        const srcs = ['kiosk', 'reception', 'online', 'kiosk'];
        const src = srcs[Math.floor(Math.random() * srcs.length)];
        const nm = this.names()[Math.floor(Math.random() * 16)];
        const t = this.issueRaw(s, r.id, 'N', src === 'kiosk' ? 'خدمة ذاتية' : nm, '010' + Math.floor(10000000 + Math.random() * 89999999), src, src !== 'online', false, 0);
        this.ev(s, 'db', 'تذكرة جديدة ' + t.code, { kiosk: 'الكشك', reception: 'الاستقبال', online: 'أونلاين' }[src] + ' · ' + this.place(s, r, 'ar'));
        if (src === 'online' && Math.random() < 0.7) setTimeout(() => this.mut((x) => this.arrive(x, t.id)), 8000);
      } else if (this.waitingOf(s, r.id, 0).some((t) => this.eligible(s, t))) {
        this.callNext(s, r.id, 'auto', 'الطبيب');
      }
    });
    setTimeout(() => this.mut((s) => { s.tickets.forEach((t) => { t.fresh = false; }); }), 2500);
  }

  normMrn(v) {
    const x = String(v || '').toUpperCase().replace(/\s/g, '');
    if (/^RH-?\d+$/.test(x)) return 'RH-' + x.replace(/^RH-?/, '');
    if (/^\d+$/.test(x)) return 'RH-' + x;
    return x;

  sendPatientMsg(s, text) {
    const body = String(text || '').trim();
    if (!body) return;
    const th = s.chat.threads.find((x) => x.mine);
    const ar = /[؀-ۿ]/.test(body);
    if (!th.msgs.length) {
      th.handled = s.agentOnline || !s.features.ai_assistant ? 'staff' : 'ai';
      th.status = th.handled === 'staff' ? 'waiting' : 'open';
    }
    th.msgs.push({ from: 'patient', text: body, ts: Date.now() });
    if (/person|human|staff|agent|أكلم حد|موظف|بني آدم/i.test(body)) {
      th.handled = 'staff'; th.status = 'waiting';

  addReview(s, t, stars, text, consent, tags) {
    this.seq += 1;
    const parts = String(s.reg.name || '').trim().split(/\s+/);
    const name = parts.length > 1 ? parts[0] + ' ' + parts[1].charAt(0) + '.' : (parts[0] || 'Patient');
    const body = String(text || '').trim();
    s.reviews.unshift({ id: 'rv' + this.seq, stars: stars, room: t.room, name: name, text: body, consent: !!consent && !!body, ts: Date.now(), tags: (tags || []).slice(), featured: false, follow: stars <= 3 ? 'open' : null });
    this.ev(s, 'db', 'rate_ticket', stars + ' نجوم' + (body ? ' · بتعليق' : '') + (consent && body ? ' · موافق على النشر' : '') + ' · زيارة مؤكدة');
  }

  goStep(n) {
    const steps = this.steps();
    const k = Math.max(0, Math.min(steps.length - 1, n));
    this.setState({ tour: k });
    steps[k].a();
  }

    base.featuresOnLabel = Object.keys(s.features).filter((k) => s.features[k]).length + ' من ' + Object.keys(s.features).length + ' شغالة';
    base.settingsRows = base.profileRows.concat(base.settingsRows);
    const dirP = pt ? this.patientsDir().find((p) => p.name === pt.name) : null;
    const prM = !pt || pt.source === 'kiosk' ? '' : pt.mine ? 'RH-84920' : dirP ? dirP.mrn : this.mrnFor(pt.phone);
    base.pr = Object.assign({}, base.pr, { hasMrn: !!prM && s.features.medical_card, mrn: prM });
    return base;
  }

  debounceEv(rid, label) {
    clearTimeout(this.evTimer);
    this.evTimer = setTimeout(() => this.mut((x) => { const r = this.roomOf(x, rid); this.ev(x, 'live', 'UPDATE rooms · ' + this.place(x, r, 'ar'), label + ' اتغير · ' + r.name + ' · ' + r.doc + ' · اتحدث على الشاشات والتطبيق'); }), 900);
  }

  qr(seed) {
    if (this.qrCache[seed]) return this.qrCache[seed];
    const N = 25;
    let x = 2166136261;
    for (let k = 0; k < seed.length; k++) { x ^= seed.charCodeAt(k); x = Math.imul(x, 16777619) >>> 0; }
    const rnd = () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
    const finder = (r, c) => {
      const zones = [[0, 0], [0, N - 7], [N - 7, 0]];
      for (const z of zones) {
        const rr = r - z[0], cc = c - z[1];
        if (rr >= -1 && rr <= 7 && cc >= -1 && cc <= 7) {
          if (rr < 0 || rr > 6 || cc < 0 || cc > 6) return 0;
          if (rr === 0 || rr === 6 || cc === 0 || cc === 6) return 1;
          if (rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4) return 1;
          return 0;
        }
      }
      return -1;
    };
    const cells = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const f = finder(r, c);
      const dark = f >= 0 ? f === 1 : (r === 6 || c === 6) ? (r + c) % 2 === 0 : rnd() < 0.5;
      cells.push({ bg: dark ? '#0F172A' : '#FFFFFF' });
    }
    this.qrCache[seed] = cells;
    return cells;
  }
}

  const mine = (s) => app.myActive(s);
  const ACTIONS = [
    ['الدكتور نده على رقمي', 'call', () => { let ok = false; app.mut((s) => { const t = mine(s); if (!t || t.day !== 0) return; if (!t.arrived) app.arrive(s, t.id); let g = 0; while (app.tOf(s, t.id).status === 'waiting' && g < 25) { app.callNext(s, t.room, 'auto'); g += 1; } s.p = 'ticket'; s.trackId = t.id; ok = true; }); done(ok ? 'اتنادى على رقمك' : 'خد رقم للنهارده الأول'); }],
    ['مريض خرج من عيادتي', 'left', () => { let ok = false; app.mut((s) => { const t = mine(s); if (!t || t.day !== 0 || t.status !== 'waiting') return; if (!t.arrived) app.arrive(s, t.id); app.callNext(s, t.room, 'auto'); ok = true; }); done(ok ? 'الدور اتحرك' : 'محتاج تذكرة النهارده ولسه مستني'); }],
    ['الكشف خلص (والروشتة)', 'finish', () => { let ok = false; app.mut((s) => { const t = mine(s); if (!t || t.status !== 'serving') return; if (s.features.prescriptions) app.tOf(s, t.id).rx = 'Concor 5 mg: one tablet every morning\nAspirin 81 mg: one tablet after lunch\nECG and follow-up in 2 weeks'; app.finishCurrent(s, t.room); s.p = 'ticket'; s.trackId = t.id; ok = true; }); done(ok ? 'الكشف خلص، وتقدر تقيّم الزيارة' : 'لازم الدكتور ينده على رقمك الأول'); }],
    ['الدكتور طلب متابعة', 'fu', () => { app.mut((s) => { const day = app.dateOf(14); s.followUp = { room: 'bc3', days: 14, day: day, booked: false }; app.notify(s, { en: 'Dr. Tarek wants to see you again. Suggested: ' + day.en + '. Book in one tap.', ar: 'د. طارق عايز يشوفك تاني. اليوم المقترح: ' + day.ar + '. احجز بضغطة.' }, 'home'); app.toast(s, 'pToast', { en: 'Follow-up suggested: ' + day.en, ar: 'متابعة مقترحة: ' + day.ar }); s.p = 'home'; }); done('وصل اقتراح المتابعة على الرئيسية'); }],
    ['المعمل بعت نتيجة تحاليل', 'lab', () => { app.mut((s) => { s.rs = Object.assign(s.rs, { kind: 'lab', tpl: 'cbc', found: 'RH-84920', confirm: 'RH-84920', vals: {}, impression: null }); app.sendReport(s); }); done('النتيجة وصلت'); }],
    ['الأشعة بعتت تقرير', 'rad', () => { app.mut((s) => { s.rs = Object.assign(s.rs, { kind: 'rad', tpl: 'knee', found: 'RH-84920', confirm: 'RH-84920', secs: {}, impression: null }); app.sendReport(s); }); done('التقرير وصل'); }],
    ['خدمة العملاء ردت', 'cs', () => { app.mut((s) => { const th = s.chat.threads.find((x) => x.mine); app.csReply(s, th.id, s.lang === 'ar' ? 'أهلاً بحضرتك، معاك خالد من خدمة العملاء. أقدر أساعدك في إيه؟' : 'Hi, this is Khaled from customer service. How can I help?'); }); done('خالد رد في الاستفسارات'); }],
    ['التسويق نشر عرض جديد', 'offer', () => { app.mut((s) => { app.publishPromo(s); }); done('العرض وصل إشعار'); }]
  ];
  const SWITCHES = [
    ['الدفع أونلاين (كارت ومحفظة وفوري)', 'online_payment', ['pay_card', 'pay_wallet', 'pay_fawry']],
    ['الروشتة', 'prescriptions'], ['المساعد الذكي في الشات', 'ai_assistant'], ['العلاج الطبيعي', 'physiotherapy'], ['العروض', 'promotions'], ['تقارير التحاليل والأشعة', 'lab_reports', ['radiology_reports']]
  ];

  // ---- UI ----
  const fab = el('button', { id: 't-fab', type: 'button', 'aria-label': 'ملاحظات وتجربة', on: { click: () => open() } }, [
    el('span', { class: 't-dot', 'aria-hidden': 'true' }), el('span', { text: 'ملاحظة' })
  ]);
  const scrim = el('div', { id: 't-scrim', hidden: '', on: { click: (e) => { if (e.target === scrim) close(); } } });
  const sheet = el('div', { id: 't-sheet', role: 'dialog', 'aria-label': 'ملاحظات وتجربة', dir: 'rtl' });
  scrim.appendChild(sheet);
  const toast = el('div', { id: 't-toast', role: 'status', hidden: '' });
  document.getElementById('device').append(fab, scrim, toast);

  function flash(msg) { toast.textContent = msg; toast.hidden = false; clearTimeout(flash.t); flash.t = setTimeout(() => { toast.hidden = true; }, 2600); }
  function open() { scrim.hidden = false; draw(); setTimeout(() => { const ta = $('#t-text'); if (ta && tab === 'note') ta.focus(); }, 60); }
  function close() { scrim.hidden = true; }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !scrim.hidden) close(); });

  function when(iso) {
    const d = new Date(iso); if (isNaN(d)) return '';
    return d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' }) + ' · ' + d.toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' });
  }

  function draw() {
    const screenKey = app.state.p; const screenName = SCREENS[screenKey] || screenKey;
    sheet.textContent = '';
    sheet.appendChild(el('div', { class: 't-grab', 'aria-hidden': 'true' }));
    const tabs = el('div', { class: 't-tabs', role: 'tablist' }, [['note', 'ملاحظة'], ['list', 'ملاحظات الفريق' + (notes.length ? ' (' + notes.length + ')' : '')], ['play', 'جرّب']].map(([k, l]) =>
      el('button', { type: 'button', role: 'tab', 'aria-selected': String(tab === k), class: 't-tab' + (tab === k ? ' on' : ''), text: l, on: { click: () => { tab = k; draw(); } } })));
    sheet.appendChild(tabs);

    if (tab === 'note') {
      const name = LS.get('rofayda-tester-name') || '';
      sheet.append(
        el('div', { class: 't-where' }, [el('span', { text: 'على شاشة: ' }), el('b', { text: screenName }), el('span', { class: 't-muted', text: app.state.lang === 'ar' ? ' · عربي' : ' · English' })]),
        el('div', { class: 't-chips', role: 'radiogroup', 'aria-label': 'نوع الملاحظة' }, KINDS.map(([k, l]) => el('button', { type: 'button', role: 'radio', 'aria-checked': String(kind === k), class: 't-chip' + (kind === k ? ' on' : ''), text: l, on: { click: () => { kind = k; draw(); } } }))),
        el('label', { for: 't-text', class: 't-label', text: 'ملاحظتك' }),
        el('textarea', { id: 't-text', rows: '4', placeholder: 'مثلاً: الزرار ده محتاج يبقى أكبر، أو عايزين نضيف هنا رقم التأمين' }),
        el('label', { for: 't-name', class: 't-label', text: 'اسمك (عشان نعرف الملاحظة من مين)' }),
        el('input', { id: 't-name', value: name, autocomplete: 'name', placeholder: 'مثلاً: د. أحمد · الإدارة' }),
        el('button', { type: 'button', class: 't-primary', text: 'احفظ الملاحظة', on: { click: save } }),
        el('div', { class: 't-muted t-small', text: db ? 'الملاحظات بتتحفظ للفريق كله، ومعتز يقدر يشوفها ويظبطها.' : 'الملاحظات بتتحفظ على الموبايل ده بس. من "ملاحظات الفريق" تقدر تنسخها كلها وتبعتها.' })
      );
    } else if (tab === 'list') {
      if (!notes.length) sheet.appendChild(el('div', { class: 't-empty', text: 'لسه مفيش ملاحظات. أول ملاحظة هتظهر هنا.' }));
      const list = el('div', { class: 't-list' }, notes.map((n) => el('div', { class: 't-note' }, [
        el('div', { class: 't-note-top' }, [el('span', { class: 't-tag k-' + (n.kind || 'add'), text: KIND_NAME[n.kind] || 'ملاحظة' }), el('span', { class: 't-muted t-small', text: (n.screen || '') + ' · ' + when(n.at) })]),
        el('div', { class: 't-note-text', dir: 'auto', text: n.text || '' }),
        el('div', { class: 't-muted t-small', text: n.by ? 'من: ' + n.by : '' })
      ])));
      sheet.appendChild(list);
      if (notes.length) sheet.appendChild(el('button', { type: 'button', class: 't-secondary', text: 'انسخ كل الملاحظات', on: { click: copyAll } }));
    } else {
      sheet.appendChild(el('div', { class: 't-muted t-small', text: 'الأزرار دي بتعمل اللي الموظفين بيعملوه في المستشفى، عشان تشوف التطبيق بيتصرف إزاي.' }));
      sheet.appendChild(el('div', { class: 't-grid' }, ACTIONS.map(([l, k, f]) => el('button', { type: 'button', class: 't-action', text: l, on: { click: f } }))));
      sheet.appendChild(el('div', { class: 't-label', text: 'مفاتيح السوبر أدمن' }));
      sheet.appendChild(el('div', { class: 't-switches' }, SWITCHES.map(([l, key, extra]) => {
        const on = !!app.state.features[key];
        return el('button', { type: 'button', role: 'switch', 'aria-checked': String(on), class: 't-switch' + (on ? ' on' : ''), on: { click: () => { app.mut((s) => { s.features[key] = !on; (extra || []).forEach((x) => { s.features[x] = !on; }); }); draw(); } } }, [el('span', { text: l }), el('span', { class: 't-knob', 'aria-hidden': 'true' })]);
      })));
      sheet.appendChild(el('div', { class: 't-row' }, [
        el('button', { type: 'button', class: 't-secondary', text: app.state.lang === 'ar' ? 'English' : 'العربية', on: { click: () => { app.setState({ lang: app.state.lang === 'ar' ? 'en' : 'ar' }); draw(); } } }),
        el('button', { type: 'button', class: 't-secondary', text: 'ابدأ من الأول', on: { click: () => { app.qrCache = {}; app.setState(app.initial()); app.setState({ sim: true }); done('رجعنا للبداية'); } } })
      ]));
    }
    sheet.appendChild(el('button', { type: 'button', class: 't-close', text: 'قفل', on: { click: close } }));
  }

  async function save() {
    const text = ($('#t-text').value || '').trim(); const by = ($('#t-name').value || '').trim();
    if (text.length < 3) { $('#t-text').focus(); flash('اكتب الملاحظة الأول'); return; }
    LS.set('rofayda-tester-name', by);
    const note = { screen: SCREENS[app.state.p] || app.state.p, screenKey: app.state.p, lang: app.state.lang, kind: kind, text: text.slice(0, 1500), by: by.slice(0, 80), at: new Date().toISOString(), resolved: false };
    if (db) {
      try { await db.collection('feedback').add(note); done('الملاحظة اتحفظت للفريق'); return; } catch (e) { /* fall back to this phone */ }
    }
    notes.unshift(note); LS.set('rofayda-notes', JSON.stringify(notes.slice(0, 200)));
    done('الملاحظة اتحفظت على الموبايل ده');
  }

  function copyAll() {
    const text = notes.map((n) => '• [' + (KIND_NAME[n.kind] || '') + '] ' + n.screen + ': ' + n.text + (n.by ? ' (' + n.by + ')' : '')).join('\n');
    const ok = () => flash('اتنسخت');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, () => fallback(text)); else fallback(text);
    function fallback(t) { const ta = el('textarea', {}); ta.value = t; sheet.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { flash('حدد النص وانسخه'); } }
  }

  // local notes first, then the team store when the viewer serves it
  try { notes = JSON.parse(LS.get('rofayda-notes') || '[]'); } catch (e) { notes = []; }
  if (window.claude && window.claude.use) {
    window.claude.use('db').then((d) => {
      if (!d) return;
      db = d;
      unsub = db.collection('feedback').orderBy('at', 'desc').limit(100).onSnapshot((snap) => {
        notes = snap.docs.map((x) => x.data()).filter(Boolean);
        fab.classList.toggle('has', notes.length > 0);
        if (!scrim.hidden && tab === 'list') draw();
      }, () => {});
    }).catch(() => {});
  }
})();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body></html>
